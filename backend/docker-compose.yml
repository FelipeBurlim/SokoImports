services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: soko_bd
      POSTGRES_USER: Koba
      POSTGRES_PASSWORD: BinhaPassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Koba -d soko_bd"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: spring_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/soko_bd
      SPRING_DATASOURCE_USERNAME: Koba
      SPRING_DATASOURCE_PASSWORD: BinhaPassword
      STORAGE_LOCAL_DIR: uploads/
      STORAGE_BASE_URL: http://localhost:8080/uploads/
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  pgdata:
  uploads_data: