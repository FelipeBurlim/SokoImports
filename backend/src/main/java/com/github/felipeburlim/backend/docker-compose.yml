version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: soko_bd
      POSTGRES_USER: Koba
      POSTGRES_PASSWORD: BinhaPassword # Altere para uma senha forte
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: spring_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/soko_bd
      SPRING_DATASOURCE_USERNAME: Koba
      SPRING_DATASOURCE_PASSWORD: BinhaPassword
      STORAGE_LOCAL-DIR: uploads/
      STORAGE_BASE-URL: http://localhost:8080/uploads/
    depends_on:
      - postgres
    volumes:
      - uploads_data:/app/uploads

volumes:
  pgdata:
  uploads_data: